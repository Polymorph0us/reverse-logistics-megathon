services:
  postgres:
    image: postgres:15-alpine
    container_name: reversechain-postgres
    environment:
      POSTGRES_DB: reversechaindb
      POSTGRES_USER: rc_user
      POSTGRES_PASSWORD: rc_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
