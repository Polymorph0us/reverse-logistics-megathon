spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/reversechaindb
    driver-class-name: org.postgresql.Driver
    username: rc_user
    password: rc_password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
blockchain:
  mode: local
# url: Matches your PostgreSQL host, port (5432), and database name (reversechaindb).