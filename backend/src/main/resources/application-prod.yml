spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reversechaindb
    username: rc_user
    password: rc_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
